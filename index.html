<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejercicio 5 - Testimonios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body class="bg-light p-4">

    <div class="container">

        <h2 class="h3 fw-bold text-center mb-4">
            Lo que dicen nuestros estudiantes
        </h2>

        <div class="row g-4">

            <!-- Testimonio 1 -->
            <div class="col-12 col-md-6">

                <figure class="p-4 bg-white border-start border-4 border-primary rounded shadow-sm h-100">

                    <blockquote class="blockquote">
                        <p class="fs-5 fw-medium mb-3">
                            "Gracias a la metodología Mobile First pude lanzar
                            mi proyecto y adaptarlo fácilmente a dispositivos móviles."
                        </p>
                    </blockquote>

                    <figcaption class="blockquote-footer mb-0">
                        Mariana Silva en
                        <cite title="Tech Startups">Tech Startups</cite>
                    </figcaption>

                </figure>

            </div>

            <!-- Testimonio 2 -->
            <div class="col-12 col-md-6">

                <figure class="p-4 bg-white border-start border-4 border-success rounded shadow-sm h-100">

                    <blockquote class="blockquote">
                        <p class="fs-5 fw-medium mb-3">
                            "Aprender a usar los 3 métodos de conexión me dio
                            más confianza para desarrollar mis páginas web."
                        </p>
                    </blockquote>

                    <figcaption class="blockquote-footer mb-0">
                        David López en
                        <cite title="Freelance">DevStudio</cite>
                    </figcaption>

                </figure>

            </div>

        </div>

    </div>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
